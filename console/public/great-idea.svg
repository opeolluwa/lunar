<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Light bulb -->
  <g>
    <!-- Bulb glass -->
    <path d="M 85 60 Q 75 75 75 90 Q 75 105 85 110 L 115 110 Q 125 105 125 90 Q 125 75 115 60 Q 100 50 100 50 Q 100 50 85 60 Z"
          fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>

    <!-- Inner glow -->
    <ellipse cx="100" cy="85" rx="18" ry="20" fill="#38bdf8" opacity="0.6"/>

    <!-- Bulb cap -->
    <rect x="92" y="110" width="16" height="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Base spiral lines -->
    <g stroke="#0284c7" stroke-width="1.5" fill="none">
      <path d="M 97 118 Q 100 122 103 118"/>
      <path d="M 96 122 Q 100 126 104 122"/>
    </g>

    <!-- Rays of light around bulb -->
    <g stroke="#0ea5e9" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="100" y1="30" x2="100" y2="40"/>
      <line x1="130" y1="50" x2="122" y2="58"/>
      <line x1="140" y1="80" x2="130" y2="80"/>
      <line x1="70" y1="50" x2="78" y2="58"/>
      <line x1="60" y1="80" x2="70" y2="80"/>
    </g>
  </g>

  <!-- Person sitting on bulb -->
  <g>
    <!-- Body -->
    <ellipse cx="100" cy="95" rx="11" ry="14" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>

    <!-- Head -->
    <circle cx="100" cy="70" r="13" fill="#f0f9ff" stroke="#075985" stroke-width="1.5"/>

    <!-- Hair -->
    <path d="M 87 70 Q 87 55 100 52 Q 113 55 113 70" fill="#082f49" stroke="#075985" stroke-width="1.5"/>

    <!-- Eyes wide open (excited) -->
    <circle cx="96" cy="68" r="2.5" fill="#082f49"/>
    <circle cx="104" cy="68" r="2.5" fill="#082f49"/>

    <!-- Mouth smile -->
    <path d="M 96 75 Q 100 78 104 75" stroke="#082f49" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Left arm raised up -->
    <g>
      <line x1="89" y1="88" x2="75" y2="70" stroke="#f0f9ff" stroke-width="3" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="73" cy="68" r="3.5" fill="#f0f9ff" stroke="#075985" stroke-width="1"/>
      <!-- Fingers -->
      <line x1="73" y1="65" x2="72" y2="60" stroke="#075985" stroke-width="1" stroke-linecap="round"/>
      <line x1="76" y1="66" x2="78" y2="60" stroke="#075985" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Right arm -->
    <line x1="111" y1="88" x2="125" y2="80" stroke="#f0f9ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="127" cy="78" r="3" fill="#f0f9ff" stroke="#075985" stroke-width="1"/>

    <!-- Left leg -->
    <g>
      <line x1="95" y1="109" x2="88" y2="130" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Shoe -->
      <ellipse cx="86" cy="132" rx="4" ry="3" fill="#082f49"/>
    </g>

    <!-- Right leg in air -->
    <g>
      <line x1="105" y1="109" x2="115" y2="100" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Shoe -->
      <ellipse cx="117" cy="98" rx="4" ry="3" fill="#082f49" transform="rotate(-30 117 98)"/>
    </g>
  </g>

  <!-- Motion lines around person -->
  <g stroke="#075985" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 120 100 Q 135 95 145 90"/>
    <path d="M 118 110 Q 140 110 155 115"/>
    <path d="M 70 95 Q 50 90 40 85"/>
  </g>
</svg>
